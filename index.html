<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit Signal Bot</title>
<style>
:root{--bg:#0b0e14;--card:#121824;--bd:#1e293b;--blue:#3b82f6;--red:#ef4444;--green:#10b981;--tx:#f8fafc;--mu:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
body{background:var(--bg);color:var(--tx);padding:16px;max-width:900px;margin:auto}
h1{font-size:1.2rem;color:#60a5fa;margin-bottom:10px}
.badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:.8rem;font-weight:600;margin:0 6px 8px 0;background:#334155;color:#cbd5e1}
.badge.ok{background:rgba(16,185,129,.2);color:var(--green);border:1px solid var(--green)}
.badge.bad{background:rgba(239,68,68,.2);color:var(--red);border:1px solid var(--red)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:.95rem;color:var(--mu);margin-bottom:10px;display:flex;justify-content:space-between}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mk{background:#1e293b;border:1px solid #334155;color:var(--mu);padding:7px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.82rem}
.mk.active{background:var(--blue);color:#fff;border-color:var(--blue)}
button.b{flex:1;padding:12px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;color:#fff;min-width:120px}
.g{background:var(--green)}.r{background:var(--red)}.bl{background:var(--blue)}
button:disabled{opacity:.4;cursor:not-allowed}
input{background:#1e293b;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;width:90px}
label{font-size:.8rem;color:var(--mu)}
.price{font-size:1.9rem;font-weight:bold}
.digit{display:inline-block;padding:3px 9px;border-radius:6px;background:#1e293b;color:#38bdf8;font-weight:bold}
.circles{display:flex;justify-content:space-around;padding:10px 0}
.c{width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.c.e{border:5px solid var(--blue)}.c.o{border:5px solid var(--red)}
.c b{font-size:1.25rem}.c span{font-size:.7rem;color:var(--mu)}
.stream{display:flex;gap:5px;overflow-x:auto;padding:4px 0}
.p{min-width:30px;height:30px;border-radius:6px;display:flex;justify-content:center;align-items:center;font-weight:bold;background:#1e293b;border:1px solid #334155;flex-shrink:0}
.p.e{color:#60a5fa}.p.o{color:#f87171}
.sig{text-align:center;font-size:1.5rem;font-weight:800;margin:8px 0}
.sig.w{color:#f59e0b}.sig.go{color:var(--green)}
.term{background:#05070a;border:1px solid var(--bd);border-radius:10px;padding:10px;height:170px;overflow-y:auto;font-family:monospace;font-size:.72rem;color:#38bdf8}
.warn{font-size:.75rem;color:#f59e0b;margin-top:8px}
</style>
</head>
<body>
<h1>⚡ Digit Signal Bot</h1>
<div><span id="feedB" class="badge bad">Feed: off</span><span id="authB" class="badge bad">Not logged in</span><span id="tradeB" class="badge bad">Trading: off</span></div>

<div class="card">
  <h2><span>Account</span><span id="bal">-</span></h2>
  <div class="row">
    <button class="b bl" id="loginBtn">Login with Deriv</button>
    <button class="b r" id="logoutBtn" disabled>Logout</button>
  </div>
  <div class="warn">Demo accounts only. The bot refuses to trade on a real account.</div>
</div>

<div class="card">
  <h2><span>Market</span></h2>
  <div class="row" id="markets">
    <button class="mk active" data-s="R_10">R_10</button><button class="mk" data-s="R_25">R_25</button>
    <button class="mk" data-s="R_50">R_50</button><button class="mk" data-s="R_75">R_75</button>
    <button class="mk" data-s="R_100">R_100</button><button class="mk" data-s="1HZ10V">1HZ10</button>
    <button class="mk" data-s="1HZ25V">1HZ25</button><button class="mk" data-s="1HZ50V">1HZ50</button>
    <button class="mk" data-s="1HZ75V">1HZ75</button><button class="mk" data-s="1HZ100V">1HZ100</button>
  </div>
</div>

<div class="card">
  <h2><span>Live</span><span id="cnt">0 Ticks</span></h2>
  <div class="price" id="price">0.0000</div>
  <span class="digit" id="dig">Last Digit: -</span>
  <div class="circles">
    <div class="c e"><b id="evp">50.0%</b><span>EVEN</span></div>
    <div class="c o"><b id="odp">50.0%</b><span>ODD</span></div>
  </div>
  <div class="stream" id="stream"></div>
  <div class="sig w" id="sig">STANDBY</div>
  <div class="row">
    <button class="b g" id="startBtn">▶ Start Signals</button>
    <button class="b r" id="stopBtn" disabled>⏹ Stop</button>
  </div>
</div>

<div class="card">
  <h2><span>Trading (demo)</span><span id="pl">P/L: 0.00</span></h2>
  <div class="row" style="margin-bottom:10px">
    <label>Stake <input id="stake" type="number" value="1" min="0.35" step="0.01"></label>
    <label>Ticks <input id="dur" type="number" value="1" min="1" max="10"></label>
  </div>
  <div class="row" style="margin-bottom:10px">
    <label>Max trades <input id="maxT" type="number" value="10" min="1"></label>
    <label>Stop-loss <input id="maxL" type="number" value="5" min="1"></label>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button class="b bl" id="buyEven" disabled>Buy EVEN</button>
    <button class="b r" id="buyOdd" disabled>Buy ODD</button>
  </div>
  <label><input type="checkbox" id="auto" style="width:auto"> Auto-trade on signals (demo)</label>
  <div class="warn" id="tstat">Trades: 0</div>
</div>

<div class="card"><h2>Log</h2><div class="term" id="term"></div></div>

<script>
// ===== Settings =====
const CLIENT_ID='34FrIZ9DW6hxpAzWUIQ9G';
const REDIRECT_URI='https://kibetval.github.io/Even-odd-new/';
const API='https://api.derivws.com';
const PUBLIC_WS='wss://api.derivws.com/trading/v1/options/ws/public';

const $=id=>document.getElementById(id);
function log(m){const d=document.createElement('div');d.textContent=`[${new Date().toLocaleTimeString()}] ${m}`;$('term').appendChild(d);$('term').scrollTop=1e9}
function badge(id,t,ok){$(id).textContent=t;$(id).className='badge '+(ok?'ok':'bad')}

// ===== Market feed (public, no login) =====
let feed=null,feedId=0,sym='R_10',pip=2,hist=[],streamId=null,running=false;
function connectFeed(){
  const my=++feedId; if(feed)try{feed.close()}catch(e){}
  feed=new WebSocket(PUBLIC_WS); const s=feed;
  s.onopen=()=>{if(my!==feedId)return;badge('feedB','Feed: live',true);log('Feed connected.');reqFeed()};
  s.onmessage=e=>{
    if(my!==feedId)return; const d=JSON.parse(e.data);
    if(d.error){log('Feed error: '+(d.error.message||d.error.code));return}
    if(d.msg_type==='history'){pip=d.pip_size??pip;hist=(d.history.prices||[]).map(digit);show()}
    if(d.msg_type==='tick'){
      if(d.subscription)streamId=d.subscription.id;
      if(d.tick.symbol&&d.tick.symbol!==sym)return;
      pip=d.tick.pip_size??pip; const g=digit(d.tick.quote);
      $('price').textContent=Number(d.tick.quote).toFixed(pip);$('dig').textContent='Last Digit: '+g;
      hist.push(g);if(hist.length>100)hist.shift();show();
      if(running)signal();
    }
  };
  s.onclose=()=>{if(my!==feedId)return;badge('feedB','Feed: off',false);log('Feed closed. Retrying...');setTimeout(connectFeed,3000)};
}
function reqFeed(){
  if(!feed||feed.readyState!==1)return;
  if(streamId){feed.send(JSON.stringify({forget:streamId}));streamId=null}
  feed.send(JSON.stringify({ticks_history:sym,count:1000,end:'latest',style:'ticks'}));
  feed.send(JSON.stringify({ticks:sym,subscribe:1}));
}
function digit(p){return parseInt(Number(p).toFixed(pip).slice(-1),10)}
function show(){
  if(!hist.length)return; const n=hist.length,ev=hist.filter(x=>x%2===0).length;
  $('evp').textContent=(ev/n*100).toFixed(1)+'%';$('odp').textContent=((n-ev)/n*100).toFixed(1)+'%';$('cnt').textContent=n+' Ticks';
  $('stream').innerHTML='';hist.slice(-15).reverse().forEach(x=>{const p=document.createElement('div');p.className='p '+(x%2?'o':'e');p.textContent=x;$('stream').appendChild(p)});
}
let sigType=null;
function signal(){
  if(hist.length<10)return; const ev=hist.slice(-10).filter(x=>x%2===0).length,s=$('sig');
  if(ev>=7){sigType='DIGITODD';s.className='sig go';s.textContent='ENTER ODD'}
  else if(ev<=3){sigType='DIGITEVEN';s.className='sig go';s.textContent='ENTER EVEN'}
  else{sigType=null;s.className='sig w';s.textContent='MONITORING'}
  if(sigType&&$('auto').checked)trade(sigType,true);
}
$('markets').addEventListener('click',e=>{
  const b=e.target.closest('.mk');if(!b)return;
  document.querySelectorAll('.mk').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  sym=b.dataset.s;hist=[];reqFeed();
});
$('startBtn').onclick=()=>{running=true;$('startBtn').disabled=true;$('stopBtn').disabled=false;$('sig').textContent='ANALYZING...';log('Signals started.')};
$('stopBtn').onclick=()=>{running=false;$('startBtn').disabled=false;$('stopBtn').disabled=true;$('sig').className='sig w';$('sig').textContent='STANDBY';log('Signals stopped.')};

// ===== Login (OAuth 2.0 + PKCE) =====
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const ver=b64(crypto.getRandomValues(new Uint8Array(32)));
  const chal=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  const state=crypto.randomUUID();
  sessionStorage.setItem('cv',ver);sessionStorage.setItem('st',state);
  const u=new URL('https://auth.deriv.com/oauth2/auth');
  u.search=new URLSearchParams({response_type:'code',client_id:CLIENT_ID,redirect_uri:REDIRECT_URI,scope:'trade',state,code_challenge:chal,code_challenge_method:'S256'});
  location.href=u.toString();
}
async function handleCallback(){
  const q=new URLSearchParams(location.search);
  if(q.get('error')){log('Login error: '+q.get('error')+' '+(q.get('error_description')||''));history.replaceState({},'',REDIRECT_URI);return false}
  if(!q.get('code'))return false;
  history.replaceState({},'',REDIRECT_URI);
  if(q.get('state')!==sessionStorage.getItem('st')){log('Login failed: state mismatch.');return false}
  try{
    const r=await fetch('https://auth.deriv.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'authorization_code',client_id:CLIENT_ID,code:q.get('code'),redirect_uri:REDIRECT_URI,code_verifier:sessionStorage.getItem('cv')})});
    const j=await r.json();
    if(!r.ok||!j.access_token){log('Token error: '+JSON.stringify(j).slice(0,200));return false}
    sessionStorage.setItem('tok',j.access_token);
    sessionStorage.setItem('exp',Date.now()+(j.expires_in||3600)*1000);
    log('Login OK.');return true;
  }catch(e){log('Token request failed: '+e.message+' (browser may be blocking it)');return false}
}
function token(){const t=sessionStorage.getItem('tok'),x=+sessionStorage.getItem('exp');
  if(!t||Date.now()>x){sessionStorage.removeItem('tok');return null}return t}
$('loginBtn').onclick=login;
$('logoutBtn').onclick=()=>{sessionStorage.clear();if(tws)try{tws.close()}catch(e){}location.href=REDIRECT_URI};

// ===== Trading connection (demo only) =====
let tws=null,acct=null,ready=false,busy=false,trades=0,pnl=0,pend=null,contractId=null;
async function startTrading(){
  const t=token();if(!t)return;
  badge('authB','Logged in',true);$('loginBtn').disabled=true;$('logoutBtn').disabled=false;
  try{
    const r=await fetch(API+'/trading/v1/options/accounts',{headers:{Authorization:'Bearer '+t}});
    const j=await r.json();
    if(!r.ok){log('Accounts error: '+JSON.stringify(j).slice(0,200));return}
    const list=j.data||j.accounts||(Array.isArray(j)?j:[]);
    log('Accounts found: '+list.map(a=>(a.account_id||a.id||a.loginid)+' ('+(a.account_type||'?')+')').join(', '));
    acct=list.find(a=>String(a.account_type).toLowerCase()==='demo'||String(a.account_id||a.id||a.loginid).startsWith('VRTC'));
    if(!acct){log('No demo account found. Trading disabled for safety.');return}
    const id=acct.account_id||acct.id||acct.loginid;
    const o=await fetch(`${API}/trading/v1/options/accounts/${id}/otp`,{method:'POST',headers:{Authorization:'Bearer '+t}});
    const oj=await o.json();
    if(!o.ok||!oj.data||!oj.data.url){log('OTP error: '+JSON.stringify(oj).slice(0,200));return}
    openTradeWs(oj.data.url,id);
  }catch(e){log('Trading setup failed: '+e.message)}
}
function openTradeWs(url,id){
  tws=new WebSocket(url);
  tws.onopen=()=>{ready=true;badge('tradeB','Trading: demo '+id,true);$('buyEven').disabled=false;$('buyOdd').disabled=false;
    log('Demo trading connected.');tws.send(JSON.stringify({balance:1,subscribe:1}))};
  tws.onclose=()=>{ready=false;badge('tradeB','Trading: off',false);$('buyEven').disabled=true;$('buyOdd').disabled=true;log('Trading link closed. Login again if needed.')};
  tws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.error){log('Trade error: '+(d.error.message||d.error.code));busy=false;pend=null;return}
    if(d.msg_type==='balance')$('bal').textContent=Number(d.balance.balance).toFixed(2)+' '+(d.balance.currency||'');
    if(d.msg_type==='proposal'&&pend){
      const p=d.proposal;tws.send(JSON.stringify({buy:p.id,price:Number(p.ask_price)}));pend=null;log('Proposal ok, buying at '+p.ask_price);
    }
    if(d.msg_type==='buy'){
      contractId=d.buy.contract_id;trades++;log('Bought contract '+contractId);
      tws.send(JSON.stringify({proposal_open_contract:1,contract_id:contractId,subscribe:1}));show2();
    }
    if(d.msg_type==='proposal_open_contract'){
      const c=d.proposal_open_contract;
      if(c&&c.is_sold){pnl+=Number(c.profit);busy=false;log(`Result: ${c.profit>=0?'WIN':'LOSS'} ${Number(c.profit).toFixed(2)}`);
        if(d.subscription)tws.send(JSON.stringify({forget:d.subscription.id}));show2()}
    }
  };
}
function show2(){$('pl').textContent='P/L: '+pnl.toFixed(2);$('tstat').textContent='Trades: '+trades+' / '+$('maxT').value}
function trade(type,fromAuto){
  if(!ready||!acct){log('Not connected for trading.');return}
  if(busy)return;
  if(trades>=+$('maxT').value){log('Max trades reached. Stopping.');$('auto').checked=false;return}
  if(pnl<=-+$('maxL').value){log('Stop-loss hit. Stopping.');$('auto').checked=false;return}
  const stake=+$('stake').value,dur=Math.max(1,+$('dur').value|0);
  if(!(stake>0)||stake>10){log('Stake must be between 0 and 10 (demo safety cap).');return}
  busy=true;pend=type;
  log(`${fromAuto?'Auto ':''}Requesting ${type} on ${sym}, stake ${stake}, ${dur} tick(s)`);
  tws.send(JSON.stringify({proposal:1,amount:stake,basis:'stake',contract_type:type,currency:acct.currency||'USD',
    duration:dur,duration_unit:'t',underlying_symbol:sym}));
  setTimeout(()=>{if(pend){log('No proposal received. Resetting.');pend=null;busy=false}},10000);
}
$('buyEven').onclick=()=>trade('DIGITEVEN');
$('buyOdd').onclick=()=>trade('DIGITODD');

// ===== Start =====
(async()=>{
  log('Starting...');connectFeed();
  await handleCallback();
  if(token())startTrading();
})();
</script>
</body>
</html>
