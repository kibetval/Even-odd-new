<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Even/Odd Live Signal Analyzer Bot</title>
<style>
:root{--bg:#0b0e14;--card:#121824;--bd:#1e293b;--blue:#3b82f6;--red:#ef4444;--green:#10b981;--tx:#f8fafc;--mu:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--bd);padding-bottom:15px;flex-wrap:wrap;gap:10px}
.header h1{font-size:1.3rem;color:#60a5fa}
.status-badge{padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:600;background:#334155;color:#cbd5e1}
.status-badge.connected{background:rgba(16,185,129,.2);color:var(--green);border:1px solid var(--green)}
.status-badge.disconnected{background:rgba(239,68,68,.2);color:var(--red);border:1px solid var(--red)}
.config-bar{display:flex;gap:10px;margin-bottom:20px;background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--bd);align-items:center;flex-wrap:wrap}
.config-bar input{background:#1e293b;border:1px solid #334155;color:#fff;padding:8px 12px;border-radius:6px;width:120px}
.config-bar button{background:var(--blue);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer}
.market-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;background:var(--card);padding:15px;border-radius:12px;border:1px solid var(--bd)}
.market-btn{background:#1e293b;border:1px solid #334155;color:var(--mu);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem}
.market-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid-container{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:900px){.grid-container{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.card h2{font-size:1rem;margin-bottom:15px;color:var(--mu);display:flex;justify-content:space-between}
.price-box{font-size:2rem;font-weight:bold;margin-bottom:5px}
.digit-badge{display:inline-block;padding:4px 10px;border-radius:6px;font-weight:bold;background:#1e293b;color:#38bdf8}
.circles-wrapper{display:flex;justify-content:space-around;padding:10px 0}
.circle{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.circle.even{border:5px solid var(--blue);background:rgba(59,130,246,.1)}
.circle.odd{border:5px solid var(--red);background:rgba(239,68,68,.1)}
.circle-val{font-size:1.4rem;font-weight:bold}
.circle-label{font-size:.75rem;color:var(--mu)}
.signal-card{text-align:center;background:linear-gradient(135deg,#1e293b,#0f172a)}
.signal-status{font-size:1.6rem;font-weight:800;margin:10px 0;text-transform:uppercase}
.signal-status.wait{color:#f59e0b}
.signal-status.enter{color:var(--green);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.signal-details{font-size:.85rem;color:var(--mu);line-height:1.5}
.controls{display:flex;gap:15px;margin-bottom:20px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;color:#fff}
.btn-start{background:var(--green)}.btn-stop{background:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.terminal{background:#05070a;border:1px solid var(--bd);border-radius:10px;padding:12px;height:160px;overflow-y:auto;font-family:monospace;font-size:.75rem;color:#38bdf8}
.digits-stream{display:flex;gap:5px;overflow-x:auto;padding:5px 0}
.digit-pill{min-width:32px;height:32px;border-radius:6px;display:flex;justify-content:center;align-items:center;font-weight:bold;background:#1e293b;border:1px solid #334155;flex-shrink:0}
.digit-pill.even{color:#60a5fa}.digit-pill.odd{color:#f87171}
</style>
</head>
<body>
<div class="header">
  <h1>⚡ Deriv Even/Odd Signal Analyzer</h1>
  <div id="connectionStatus" class="status-badge disconnected">Disconnected</div>
</div>

<div class="config-bar">
  <span style="font-size:.85rem;color:var(--mu)">Legacy App ID (optional):</span>
  <input type="text" id="appIdInput" value="1089">
  <button id="reconnectBtn">Reconnect</button>
</div>

<div class="market-selector" id="marketSelector">
  <span style="align-self:center;font-size:.85rem;color:var(--mu);font-weight:600">Volatility:</span>
  <button class="market-btn active" data-symbol="R_10">R_10</button>
  <button class="market-btn" data-symbol="R_25">R_25</button>
  <button class="market-btn" data-symbol="R_50">R_50</button>
  <button class="market-btn" data-symbol="R_75">R_75</button>
  <button class="market-btn" data-symbol="R_100">R_100</button>
  <button class="market-btn" data-symbol="1HZ10V">1HZ10</button>
  <button class="market-btn" data-symbol="1HZ25V">1HZ25</button>
  <button class="market-btn" data-symbol="1HZ50V">1HZ50</button>
  <button class="market-btn" data-symbol="1HZ75V">1HZ75</button>
  <button class="market-btn" data-symbol="1HZ100V">1HZ100</button>
</div>

<div class="controls">
  <button class="btn btn-start" id="startBtn">▶ Start Signal Analyzer</button>
  <button class="btn btn-stop" id="stopBtn" disabled>⏹ Stop Analyzer</button>
</div>

<div class="grid-container">
  <div class="card">
    <h2><span>Market Overview</span><span id="totalAnalyzed">0 Ticks</span></h2>
    <div style="font-size:.75rem;color:var(--mu);margin-bottom:4px">CURRENT PRICE</div>
    <div class="price-box" id="currentPrice">0.0000</div>
    <div class="digit-badge" id="currentDigit">Last Digit: -</div>
    <div class="circles-wrapper">
      <div class="circle even"><span class="circle-val" id="evenProb">50.0%</span><span class="circle-label">EVEN</span></div>
      <div class="circle odd"><span class="circle-val" id="oddProb">50.0%</span><span class="circle-label">ODD</span></div>
    </div>
    <div style="font-size:.75rem;color:var(--mu);margin:10px 0 4px">Recent Digits Stream:</div>
    <div class="digits-stream" id="digitsStream"></div>
  </div>
  <div class="card signal-card">
    <h2>Live Trading Signal</h2>
    <div id="signalStatus" class="signal-status wait">STANDBY</div>
    <div class="signal-details" id="signalDetails">Tap 'Start Signal Analyzer' to begin.</div>
  </div>
</div>

<div class="card">
  <h2>System Terminal Log</h2>
  <div class="terminal" id="terminal"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const statusBadge=$('connectionStatus'), terminal=$('terminal');
let ws=null, isRunning=false, tickHistory=[], currentSymbol='R_10';
let activeStreamId=null, pipSize=2, connId=0, endpointIdx=0, retryTimer=null;

function log(msg){
  const d=document.createElement('div');
  d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  terminal.appendChild(d); terminal.scrollTop=terminal.scrollHeight;
}
function setStatus(text, ok){
  statusBadge.textContent=text;
  statusBadge.className='status-badge '+(ok?'connected':'disconnected');
}

// Endpoints tried in order. The first is Deriv's new public market-data
// endpoint (no login, no App ID needed). The others are legacy fallbacks.
function endpoints(){
  const appId=$('appIdInput').value.trim()||'1089';
  return [
    'wss://api.derivws.com/trading/v1/options/ws/public',
    `wss://ws.derivws.com/websockets/v3?app_id=${appId}`,
    `wss://ws.binaryws.com/websockets/v3?app_id=${appId}`
  ];
}

function connectDeriv(){
  clearTimeout(retryTimer);
  const myId=++connId;               // invalidates events from older sockets
  if(ws){ try{ws.close();}catch(e){} }
  const list=endpoints();
  const url=list[endpointIdx % list.length];
  let opened=false;

  setStatus('Connecting...', false);
  log('Connecting to: '+url);

  try{ ws=new WebSocket(url); }
  catch(e){ log('Cannot open socket: '+e.message); return scheduleRetry(myId,false); }
  const sock=ws;

  sock.onopen=()=>{
    if(myId!==connId) return;
    opened=true;
    setStatus('Connected', true);
    log('Connected.');
    requestMarketData(currentSymbol);
  };

  sock.onmessage=(event)=>{
    if(myId!==connId) return;
    try{
      const data=JSON.parse(event.data);
      if(data.error){ log(`API error: ${data.error.code||''} ${data.error.message||JSON.stringify(data.error)}`); return; }

      if(data.msg_type==='history'){
        pipSize=data.pip_size ?? pipSize;
        tickHistory=(data.history.prices||[]).map(p=>getLastDigit(p));
        log(`Loaded ${tickHistory.length} historical ticks for ${currentSymbol}`);
        updateAnalysis();
      }
      if(data.msg_type==='tick'){
        if(data.subscription) activeStreamId=data.subscription.id;
        if(data.tick.symbol && data.tick.symbol!==currentSymbol) return;
        pipSize=data.tick.pip_size ?? pipSize;
        const digit=getLastDigit(data.tick.quote);
        $('currentPrice').textContent=Number(data.tick.quote).toFixed(pipSize);
        $('currentDigit').textContent=`Last Digit: ${digit}`;
        tickHistory.push(digit);
        if(tickHistory.length>100) tickHistory.shift();
        updateAnalysis();
        if(isRunning) evaluateSignal();
      }
    }catch(err){ log('Parse error: '+err.message); }
  };

  sock.onerror=()=>{ if(myId===connId) log('WebSocket error.'); };

  sock.onclose=(e)=>{
    if(myId!==connId) return;
    setStatus('Disconnected', false);
    log(`Closed (code ${e.code}${e.reason?', '+e.reason:''}).`);
    scheduleRetry(myId, opened);
  };
}

function scheduleRetry(myId, wasOpen){
  if(myId!==connId) return;
  if(!wasOpen) endpointIdx++;        // never connected: try next endpoint
  const wait=wasOpen?3000:2000;
  log(`Retrying in ${wait/1000}s...`);
  retryTimer=setTimeout(connectDeriv, wait);
}

function requestMarketData(symbol){
  if(!ws||ws.readyState!==WebSocket.OPEN) return;
  log(`Requesting feed for ${symbol}...`);
  if(activeStreamId){ ws.send(JSON.stringify({forget:activeStreamId})); activeStreamId=null; }
  ws.send(JSON.stringify({ticks_history:symbol,count:1000,end:'latest',style:'ticks'}));
  ws.send(JSON.stringify({ticks:symbol,subscribe:1}));
}

// Uses pip size so trailing zeros are kept (e.g. 1234.50 -> 0, not 5)
function getLastDigit(price){
  return parseInt(Number(price).toFixed(pipSize).slice(-1),10);
}

function updateAnalysis(){
  if(!tickHistory.length) return;
  const total=tickHistory.length;
  const even=tickHistory.filter(d=>d%2===0).length;
  $('evenProb').textContent=((even/total)*100).toFixed(1)+'%';
  $('oddProb').textContent=(((total-even)/total)*100).toFixed(1)+'%';
  $('totalAnalyzed').textContent=total+' Ticks';
  const box=$('digitsStream'); box.innerHTML='';
  tickHistory.slice(-15).reverse().forEach(d=>{
    const p=document.createElement('div');
    p.className='digit-pill '+(d%2===0?'even':'odd');
    p.textContent=d; box.appendChild(p);
  });
}

function evaluateSignal(){
  if(tickHistory.length<10) return;
  const even=tickHistory.slice(-10).filter(d=>d%2===0).length;
  const s=$('signalStatus'), d=$('signalDetails');
  if(even>=7){
    s.className='signal-status enter'; s.textContent='ENTER ODD';
    d.innerHTML=`Many EVEN digits (${even}/10).<br><b>Signal: ODD</b>`;
  }else if(even<=3){
    s.className='signal-status enter'; s.textContent='ENTER EVEN';
    d.innerHTML=`Many ODD digits (${10-even}/10).<br><b>Signal: EVEN</b>`;
  }else{
    s.className='signal-status wait'; s.textContent='MONITORING';
    d.textContent=`Balanced (${even} Even / ${10-even} Odd). Waiting...`;
  }
}

document.querySelectorAll('.market-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.market-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSymbol=btn.dataset.symbol;
    tickHistory=[];
    requestMarketData(currentSymbol);
  });
});

$('reconnectBtn').addEventListener('click',()=>{ endpointIdx=0; connectDeriv(); });

$('startBtn').addEventListener('click',()=>{
  if(!ws||ws.readyState!==WebSocket.OPEN){ alert('Not connected yet.'); return; }
  isRunning=true; $('startBtn').disabled=true; $('stopBtn').disabled=false;
  log('Analyzer started.');
  $('signalStatus').className='signal-status wait';
  $('signalStatus').textContent='ANALYZING...';
  evaluateSignal();
});

$('stopBtn').addEventListener('click',()=>{
  isRunning=false; $('startBtn').disabled=false; $('stopBtn').disabled=true;
  log('Analyzer paused.');
  $('signalStatus').className='signal-status wait';
  $('signalStatus').textContent='STANDBY';
  $('signalDetails').textContent='Analyzer is on standby.';
});

log('Initializing...');
connectDeriv();
</script>
</body>
</html>
