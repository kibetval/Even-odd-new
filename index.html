<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deriv Even/Odd Signal Analyzer Bot</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #101827;
      --panel-2: #0f172a;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --blue: #60a5fa;
      --red: #f87171;
      --green: #34d399;
      --amber: #fbbf24;
      --shadow: rgba(15, 23, 42, 0.7);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body {
      padding: 18px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 14px 30px var(--shadow);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2vw, 2rem);
      color: var(--blue);
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(251, 191, 36, 0.08);
      color: var(--amber);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status.connected {
      background: rgba(52, 211, 153, 0.12);
      color: var(--green);
      border-color: rgba(52, 211, 153, 0.35);
    }

    .status.error {
      background: rgba(248, 113, 113, 0.12);
      color: var(--red);
      border-color: rgba(248, 113, 113, 0.35);
    }

    .market-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .market-btn {
      border: 1px solid #334155;
      background: #1e293b;
      color: var(--muted);
      border-radius: 9px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .market-btn:hover,
    .market-btn.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      transform: translateY(-1px);
    }

    .grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.36);
    }

    .label {
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .price {
      font-size: clamp(1.7rem, 3vw, 2.6rem);
      font-weight: 800;
      font-family: "Courier New", monospace;
      letter-spacing: 0.03em;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(96, 165, 250, 0.12);
      color: var(--blue);
      border: 1px solid rgba(96, 165, 250, 0.35);
    }

    .signal-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 140px;
    }

    .signal-value {
      font-size: clamp(2rem, 5vw, 3.3rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 12px 0 8px;
    }

    .signal-value.even {
      color: var(--blue);
    }

    .signal-value.odd {
      color: var(--red);
    }

    .signal-value.wait {
      color: var(--amber);
    }

    .signal-note {
      display: inline-block;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .prob-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      gap: 12px;
      font-size: 0.95rem;
    }

    .bar-wrap {
      position: relative;
      height: 20px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 8px;
    }

    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: inherit;
      transition: width 0.35s ease;
    }

    .bar-even {
      background: linear-gradient(90deg, rgba(96,165,250,0.9), rgba(59,130,246,0.9));
      width: 50%;
    }

    .bar-odd {
      background: linear-gradient(90deg, rgba(248,113,113,0.9), rgba(239,68,68,0.9));
      width: 50%;
    }

    .controls {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .btn-start {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .terminal {
      margin-top: 18px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 180px;
      max-height: 220px;
      overflow-y: auto;
      padding: 12px;
      font-family: "Courier New", monospace;
      color: #cbd5e1;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .terminal-line {
      padding: 4px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }

    .digits-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .digit-pill {
      min-width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-weight: 800;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
    }

    .digit-pill.even {
      border-color: rgba(96, 165, 250, 0.5);
      color: var(--blue);
      background: rgba(96, 165, 250, 0.08);
    }

    .digit-pill.odd {
      border-color: rgba(248, 113, 113, 0.5);
      color: var(--red);
      background: rgba(248, 113, 113, 0.08);
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-wrap">
        <h1>Deriv Even/Odd Signal Analyzer</h1>
        <div class="subtitle">Live tick feed • probability engine • automatic signal detection</div>
      </div>
      <div id="connectionStatus" class="status">Connecting...</div>
    </header>

    <div class="market-bar" id="marketSelector">
      <button class="market-btn active" data-symbol="R_75">R_75</button>
      <button class="market-btn" data-symbol="R_10">R_10</button>
      <button class="market-btn" data-symbol="R_25">R_25</button>
      <button class="market-btn" data-symbol="R_50">R_50</button>
      <button class="market-btn" data-symbol="R_100">R_100</button>
      <button class="market-btn" data-symbol="1HZ10V">1HZ10</button>
      <button class="market-btn" data-symbol="1HZ25V">1HZ25</button>
      <button class="market-btn" data-symbol="1HZ50V">1HZ50</button>
      <button class="market-btn" data-symbol="1HZ75V">1HZ75</button>
      <button class="market-btn" data-symbol="1HZ100V">1HZ100</button>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Current Price</div>
        <div class="price-row">
          <div id="currentPrice" class="price">0.0000</div>
          <div id="lastDigitPill" class="pill">Digit: -</div>
        </div>
      </div>

      <div class="card signal-box">
        <div class="label">Signal</div>
        <div id="signalValue" class="signal-value wait">WAIT</div>
        <div id="signalNote" class="signal-note">Waiting for live tick data.</div>
      </div>
    </div>

    <div class="card" style="margin-top: 18px;">
      <div class="label">Even / Odd Probability</div>
      <div class="prob-row">
        <span>Even</span>
        <strong id="evenPercent">0.0%</strong>
      </div>
      <div class="bar-wrap">
        <div id="evenBar" class="bar-fill bar-even" style="width: 50%;"></div>
      </div>

      <div class="prob-row" style="margin-top: 14px;">
        <span>Odd</span>
        <strong id="oddPercent">0.0%</strong>
      </div>
      <div class="bar-wrap">
        <div id="oddBar" class="bar-fill bar-odd" style="width: 50%;"></div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start">Start Feed</button>
      <button id="stopBtn" class="btn btn-stop">Stop Feed</button>
    </div>

    <div class="card" style="margin-top: 18px;">
      <div class="label">Recent Digits</div>
      <div id="digitList" class="digits-list"></div>
    </div>

    <div class="terminal" id="terminal">
      <div class="terminal-line">[system] waiting for live market feed...</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('connectionStatus');
    const currentPriceEl = document.getElementById('currentPrice');
    const lastDigitPillEl = document.getElementById('lastDigitPill');
    const signalValueEl = document.getElementById('signalValue');
    const signalNoteEl = document.getElementById('signalNote');
    const evenPercentEl = document.getElementById('evenPercent');
    const oddPercentEl = document.getElementById('oddPercent');
    const evenBarEl = document.getElementById('evenBar');
    const oddBarEl = document.getElementById('oddBar');
    const digitListEl = document.getElementById('digitList');
    const terminalEl = document.getElementById('terminal');
    const marketButtons = [...document.querySelectorAll('.market-btn')];

    let ws = null;
    let recentDigits = [];
    let currentSymbol = 'R_75';
    let isRunning = true;

    function setStatus(text, type = 'neutral') {
      statusEl.textContent = text;
      statusEl.className = 'status';
      if (type === 'connected') statusEl.classList.add('connected');
      if (type === 'error') statusEl.classList.add('error');
    }

    function addTerminalLine(text) {
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      terminalEl.prepend(line);
      while (terminalEl.children.length > 18) terminalEl.removeChild(terminalEl.lastChild);
    }

    function connectSocket() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${protocol}://${location.host}`;

      try {
        ws = new WebSocket(wsUrl);
      } catch (error) {
        setStatus('Socket Error', 'error');
        addTerminalLine('Failed to open websocket connection.');
        return;
      }

      ws.onopen = () => {
        setStatus('Connected', 'connected');
        addTerminalLine('Connected to Deriv bridge.');
        ws.send(JSON.stringify({ action: 'change_symbol', symbol: currentSymbol }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleMessage(data);
        } catch (error) {
          console.error('Message parse error:', error);
        }
      };

      ws.onclose = () => {
        if (isRunning) {
          setStatus('Reconnecting...', 'neutral');
          addTerminalLine('Connection lost. Reconnecting...');
          setTimeout(connectSocket, 3000);
        } else {
          setStatus('Stopped', 'error');
        }
      };

      ws.onerror = () => {
        setStatus('Connection Error', 'error');
        addTerminalLine('WebSocket error encountered.');
      };
    }

    function handleMessage(data) {
      if (!data) return;

      if (data.type === 'status') {
        setStatus(data.message || 'Connected', data.connected ? 'connected' : 'error');
        return;
      }

      if (data.msg_type === 'history' && Array.isArray(data.history?.prices)) {
        const prices = data.history.prices
          .map((p) => Number(p))
          .filter((p) => Number.isFinite(p));

        if (prices.length) {
          const digits = prices.map((p) => Number(String(p).slice(-1))).filter((d) => !Number.isNaN(d));
          pushDigits(digits);
          addTerminalLine(`History loaded: ${prices.length} ticks for ${currentSymbol}`);
        }
        return;
      }

      if (data.type === 'tick' || data.msg_type === 'tick') {
        const tickValue = Number(data.tick?.tick ?? data.tick ?? data.price ?? 0);
        const tickDigit = Number(String(Math.abs(tickValue)).slice(-1));

        if (Number.isFinite(tickValue)) {
          currentPriceEl.textContent = tickValue.toFixed(4);
          lastDigitPillEl.textContent = `Digit: ${tickDigit}`;
          pushDigits([tickDigit]);
          addTerminalLine(`Live tick: ${tickValue} | digit ${tickDigit}`);
          updateProbability();
        }
        return;
      }

      if (data.type === 'deriv_error' || data.error) {
        addTerminalLine(`Deriv error: ${data.error?.message || JSON.stringify(data.error || data)}`);
        return;
      }

      if (data.msg_type === 'authorize') {
        addTerminalLine(`Authorization result: ${data.error ? data.error.message : 'successful'}`);
      }
    }

    function pushDigits(array) {
      if (!Array.isArray(array) || !array.length) return;
      const digits = array.filter((d) => Number.isFinite(Number(d)) && d >= 0 && d <= 9).map((d) => Number(d));
      if (!digits.length) return;
      recentDigits.push(...digits);
      recentDigits = recentDigits.slice(-80);
      renderDigits();
      updateProbability();
    }

    function renderDigits() {
      digitListEl.innerHTML = '';
      recentDigits.slice(-20).forEach((digit) => {
        const pill = document.createElement('div');
        pill.className = `digit-pill ${digit % 2 === 0 ? 'even' : 'odd'}`;
        pill.textContent = digit;
        digitListEl.appendChild(pill);
      });
    }

    function updateProbability() {
      const total = recentDigits.length;
      if (!total) {
        evenPercentEl.textContent = '0.0%';
        oddPercentEl.textContent = '0.0%';
        evenBarEl.style.width = '50%';
        oddBarEl.style.width = '50%';
        signalValueEl.textContent = 'WAIT';
        signalValueEl.className = 'signal-value wait';
        signalNoteEl.textContent = 'Waiting for live tick data.';
        return;
      }

      const evenCount = recentDigits.filter((digit) => digit % 2 === 0).length;
      const oddCount = total - evenCount;
      const evenPct = (evenCount / total) * 100;
      const oddPct = (oddCount / total) * 100;

      evenPercentEl.textContent = `${evenPct.toFixed(1)}%`;
      oddPercentEl.textContent = `${oddPct.toFixed(1)}%`;
      evenBarEl.style.width = `${evenPct}%`;
      oddBarEl.style.width = `${oddPct}%`;

      if (evenPct >= 55 && evenPct > oddPct) {
        signalValueEl.textContent = 'EVEN';
        signalValueEl.className = 'signal-value even';
        signalNoteEl.textContent = 'High even probability detected in live stream.';
      } else if (oddPct >= 55 && oddPct > evenPct) {
        signalValueEl.textContent = 'ODD';
        signalValueEl.className = 'signal-value odd';
        signalNoteEl.textContent = 'High odd probability detected in live stream.';
      } else {
        signalValueEl.textContent = 'WAIT';
        signalValueEl.className = 'signal-value wait';
        signalNoteEl.textContent = `Momentum is balanced. Even ${evenPct.toFixed(1)}% vs Odd ${oddPct.toFixed(1)}%.`;
      }
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        addTerminalLine('Feed already running.');
        return;
      }
      isRunning = true;
      connectSocket();
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      isRunning = false;
      if (ws) {
        ws.close();
      }
      setStatus('Stopped', 'error');
      addTerminalLine('Feed stopped by user.');
    });

    marketButtons.forEach((button) => {
      button.addEventListener('click', () => {
        marketButtons.forEach((btn) => btn.classList.remove('active'));
        button.classList.add('active');
        currentSymbol = button.dataset.symbol;
        addTerminalLine(`Switching market to ${currentSymbol}`);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ action: 'change_symbol', symbol: currentSymbol }));
        }
      });
    });

    connectSocket();
  </script>
</body>
</html>
